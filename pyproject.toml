[project]
name = "recoup"
version = "0.1.0"
description = "Autonomous Revenue Recovery & Smart Fallback Orchestrator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",

    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "razorpay>=1.4.2",
    "groq>=0.11.0",
    "resend>=2.4.0",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.13.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "supabase>=2.7.0",
    "gtts>=2.5.0",
    "sarvamai>=0.1.31a4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "mypy>=1.11.0",
    "types-requests>=2.32.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["B008", "E501", "N818", "UP042"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is opt-in — specify --cov=<module> on the CLI or in CI
# to avoid measuring uncovered network-dependent modules in local runs.
