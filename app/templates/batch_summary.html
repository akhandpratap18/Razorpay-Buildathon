<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Batch Recovery Results | Recoup</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --accent: #58a6ff;
      --success: #238636;
      --danger: #da3633;
      --warning: #d29922;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      margin: 0; padding: 2rem;
    }
    h1, h2, h3 { margin-top: 0; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1.5rem; }
    .card h3 { color: #8b949e; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat { font-size: 2.5rem; font-weight: 600; color: #fff; margin: 0.5rem 0; }
    .stat.green { color: var(--success); }
    
    .table-container { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
    th { background: #010409; font-size: 0.85rem; color: #8b949e; }
    tr:last-child td { border-bottom: none; }
    
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
    .badge.recovered { background: rgba(46, 160, 67, 0.15); color: #3fb950; border: 1px solid rgba(46, 160, 67, 0.4); }
    .badge.killed { background: rgba(248, 81, 73, 0.1); color: #ff7b72; border: 1px solid rgba(248, 81, 73, 0.4); }
    
    .audit-trail { font-family: monospace; font-size: 0.8rem; background: #010409; padding: 1rem; border-radius: 4px; border: 1px solid var(--border); margin-top: 0.5rem; display: none; }
    .audit-row { cursor: pointer; }
    .audit-row:hover { background: rgba(255,255,255,0.02); }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>Recoup</h1>
      <p style="color: #8b949e; margin:0;">Judging View: Recovery Batch Results</p>
    </div>
    <div style="text-align: right;">
      <a href="/ops_console.html" style="color: var(--accent); text-decoration: none;">&larr; Back to Ops Console</a>
    </div>
  </div>

  <div class="grid" id="metricsGrid">
    <div class="card"><h3>Total Processed</h3><div class="stat" id="totalTx">-</div></div>
    <div class="card"><h3>Revenue Recovered</h3><div class="stat green" id="totalRecovered">-</div></div>
    <div class="card"><h3>Fraud Clean-Stops</h3><div class="stat" id="fraudStops" style="color: var(--danger);">-</div></div>
  </div>

  <h2>Category Breakdown</h2>
  <div class="table-container" style="margin-bottom: 2rem;">
    <table id="categoryTable">
      <thead><tr><th>Category</th><th>Count</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <h2>Audit Trail Proof-of-Work (Latest 5 Terminal)</h2>
  <div class="table-container">
    <table id="auditTable">
      <thead><tr><th>Transaction ID</th><th>Amount</th><th>Category</th><th>Status</th><th>Audit Trail</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
  async function loadData() {
    const res = await fetch('/batch-summary');
    const data = await res.json();
    
    document.getElementById('totalTx').textContent = data.metrics.total_transactions;
    document.getElementById('totalRecovered').textContent = "₹" + data.metrics.recovered_amount_inr.toLocaleString('en-IN', {minimumFractionDigits: 2});
    document.getElementById('fraudStops').textContent = data.metrics.fraud_clean_stops;
    
    const catTbody = document.querySelector('#categoryTable tbody');
    for (const [cat, count] of Object.entries(data.metrics.category_breakdown)) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${cat.replace(/_/g, ' ').toUpperCase()}</td><td>${count}</td>`;
      catTbody.appendChild(tr);
    }
    
    const auditTbody = document.querySelector('#auditTable tbody');
    data.samples.forEach(sample => {
      const tr = document.createElement('tr');
      tr.className = 'audit-row';
      
      const badgeClass = sample.status === 'recovered' ? 'recovered' : (sample.status === 'killed' || sample.status === 'escalated' ? 'killed' : '');
      
      let trailHtml = sample.trail.map(a => `[${new Date(a.created_at).toLocaleTimeString()}] <b>${a.actor}</b>: ${a.event_type}`).join('<br>');
      
      tr.innerHTML = `
        <td>${sample.id.split('-')[0]}...</td>
        <td>₹${sample.amount_inr.toLocaleString()}</td>
        <td>${sample.category}</td>
        <td><span class="badge ${badgeClass}">${sample.status.toUpperCase()}</span></td>
        <td><button onclick="toggleAudit('${sample.id}')" style="background:var(--border);color:white;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;">View Trail</button></td>
      `;
      
      const trDetails = document.createElement('tr');
      trDetails.innerHTML = `<td colspan="5" style="padding:0; border:none;"><div id="audit-${sample.id}" class="audit-trail">${trailHtml}</div></td>`;
      
      auditTbody.appendChild(tr);
      auditTbody.appendChild(trDetails);
    });
  }
  
  window.toggleAudit = function(id) {
    const el = document.getElementById('audit-' + id);
    el.style.display = el.style.display === 'block' ? 'none' : 'block';
  }
  
  loadData();
</script>
</body>
</html>
